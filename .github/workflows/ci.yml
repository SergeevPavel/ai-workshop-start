# CI for your Skill Atlas repository: the typecheck, the tests and the CLI itself, on every push
# and pull request, on a clean machine. A pull request is ready when this is green.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    # The demo goldens are screenshots from this image. Its tag MUST match `playwright` in package-lock.json.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # A failed demo leaves its actual screenshots here, to compare with the goldens.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: demo-screenshots
          path: test-results/demo/
          if-no-files-found: ignore
      # The real CLI on the fixture repository, as a user would run it: it must exit 0.
      - name: Smoke test
        run: |
          ./skill-atlas help
          ./skill-atlas scan ./fixture
